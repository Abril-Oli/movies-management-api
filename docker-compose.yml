services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: movies_management
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies -d movies_management"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
